<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JML Dialer</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="stylesheet" href="style.css" />
  <!-- Remixicon for sharp iOS style icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>

  <div class="app-container">
    
    <!-- TOP STATUS BAR SIMULATION -->
    <header class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <i class="ri-signal-tower-fill"></i>
        <i class="ri-wifi-line"></i>
        <i class="ri-battery-fill"></i>
      </div>
    </header>

    <!-- SCREEN CONTENT CONTAINER -->
    <main class="main-content">
      
      <!-- SCREEN 1: KEYPAD (ACTIVE BY DEFAULT) -->
      <section id="screen-keypad" class="screen active">
        <!-- Caller ID Header -->
        <div class="caller-id-selector">
          <div class="caller-flag">🇺🇸</div>
          <div class="caller-info">
            <span class="caller-number">+1 (347) 555-8921</span>
            <span class="caller-label">My Caller ID <span class="status-dot"></span> Online</span>
          </div>
          <i class="ri-arrow-right-s-line chevron"></i>
        </div>

        <!-- Display Area -->
        <div class="dialer-display">
          <input type="text" id="phone-number" placeholder="" readonly />
          <div class="contact-preview">
            <span class="contact-name">John Smith</span>
            <span class="contact-location">New York, USA</span>
          </div>
        </div>

        <!-- Keypad Grid -->
        <div class="keypad-grid">
          <button class="key" data-value="1"><span class="num">1</span><span class="sub"></span></button>
          <button class="key" data-value="2"><span class="num">2</span><span class="sub">ABC</span></button>
          <button class="key" data-value="3"><span class="num">3</span><span class="sub">DEF</span></button>
          <button class="key" data-value="4"><span class="num">4</span><span class="sub">GHI</span></button>
          <button class="key" data-value="5"><span class="num">5</span><span class="sub">JKL</span></button>
          <button class="key" data-value="6"><span class="num">6</span><span class="sub">MNO</span></button>
          <button class="key" data-value="7"><span class="num">7</span><span class="sub">PQRS</span></button>
          <button class="key" data-value="8"><span class="num">8</span><span class="sub">TUV</span></button>
          <button class="key" data-value="9"><span class="num">9</span><span class="sub">WXYZ</span></button>
          <button class="key" data-value="*"><span class="num">*</span><span class="sub"></span></button>
          <button class="key" data-value="0"><span class="num">0</span><span class="sub">+</span></button>
          <button class="key" data-value="#"><span class="num">#</span><span class="sub"></span></button>
        </div>

        <!-- Action Row (Call / Backspace) -->
        <div class="keypad-actions">
          <div class="action-spacer"></div>
          <button class="call-btn" id="make-call-btn">
            <i class="ri-phone-fill"></i>
          </button>
          <button class="backspace-btn" id="delete-btn">
            <i class="ri-delete-back-2-line"></i>
          </button>
        </div>
      </section>

      <!-- Placeholder Screens for later -->
      <section id="screen-history" class="screen"><div class="placeholder">History Screen</div></section>
      <section id="screen-messages" class="screen"><div class="placeholder">Messages Screen</div></section>
      <section id="screen-contacts" class="screen"><div class="placeholder">Contacts Screen</div></section>
      <section id="screen-more" class="screen"><div class="placeholder">More & Settings</div></section>

    </main>

    <!-- BOTTOM TAB NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-target="screen-keypad">
        <i class="ri-grid-fill"></i>
        <span>Keypad</span>
      </button>
      <button class="nav-item" data-target="screen-history">
        <i class="ri-history-line"></i>
        <span>History</span>
      </button>
      <button class="nav-item" data-target="screen-messages">
        <i class="ri-message-3-line"></i>
        <span>Messages</span>
      </button>
      <button class="nav-item" data-target="screen-contacts">
        <i class="ri-user-3-line"></i>
        <span>Contacts</span>
      </button>
      <button class="nav-item" data-target="screen-more">
        <i class="ri-more-fill"></i>
        <span>More</span>
      </button>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
